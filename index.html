<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#152030" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Flight Deck">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-family:system-ui,sans-serif;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>CSE Flight Deck</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a cockpit-style console. A sticky flight strip on top, tabbed panels below, semesters drawn as waypoints along a route. */
:root{
  --bg:#EEF2F7; --surface:#FFFFFF; --sunk:#E3E9F1; --ink:#13202F; --muted:#56677D; --line:#D3DBE6;
  --accent:#B45309; --accent-soft:#FBEFD9; --done:#0F766E; --done-soft:#DCF2EE; --prog:#1D4ED8; --prog-soft:#E2EAFB; --warn:#B91C1C;
  --f-display:"Chakra Petch","Segoe UI",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r:8px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D141E; --surface:#152030; --sunk:#101925; --ink:#E5ECF5; --muted:#93A4BA; --line:#253449;
  --accent:#F2A33A; --accent-soft:#3A2911; --done:#34D3BE; --done-soft:#0E2E2B; --prog:#82A6F8; --prog-soft:#1A2950; --warn:#F87171; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D141E; --surface:#152030; --sunk:#101925; --ink:#E5ECF5; --muted:#93A4BA; --line:#253449;
  --accent:#F2A33A; --accent-soft:#3A2911; --done:#34D3BE; --done-soft:#0E2E2B; --prog:#82A6F8; --prog-soft:#1A2950; --warn:#F87171; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:.01em}
h2{font-size:1.35rem}h3{font-size:1.05rem}
.mono{font-family:var(--f-mono)}
.muted{color:var(--muted)}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header strip */
header.strip{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.strip .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:10px 20px;padding-block:12px}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.brand h1{font-size:1.35rem;text-transform:uppercase;letter-spacing:.06em}
.brand .tag{font-family:var(--f-mono);font-size:.75rem;color:var(--accent)}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap}
nav.tabs button{background:none;border:1px solid transparent;border-radius:6px;padding:6px 12px;font-weight:500;color:var(--muted)}
nav.tabs button:hover{color:var(--ink);background:var(--sunk)}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--line);background:var(--bg)}
.save{font-family:var(--f-mono);font-size:.72rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.save i{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.save.ok i{background:var(--done)}.save.err i{background:var(--warn)}
@media (max-width:700px){header.strip{position:static}.brand .tag{display:none}.strip .wrap{gap:8px 12px}
  nav.tabs{flex-wrap:nowrap;overflow-x:auto;width:100%;scrollbar-width:none}nav.tabs button{white-space:nowrap;flex:none}}

/* campus map */
#mapHost{height:min(62vh,560px);min-height:320px;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:var(--sunk)}
#mapHost .leaflet-container,#mapHost.leaflet-container{font-family:var(--f-body);background:var(--sunk)}
.leaflet-container img{max-width:none!important}
#mapHost.dark-tiles .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.9) contrast(.9)}
#mapHost:not(.zoomed) .blabel{display:none}
.blabel{background:var(--surface);color:var(--ink);border:1px solid var(--line);font-size:.72rem;padding:1px 5px;box-shadow:none}
.blabel::before{display:none}
.dlabel{background:var(--accent);color:var(--surface);border:0;font-weight:600;font-size:.8rem}
.dlabel::before{border-top-color:var(--accent)!important}
.leaflet-popup-content{margin:10px 12px;font-family:var(--f-body)}
.leaflet-popup-content button{margin-top:6px}
.guide{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center}
.arrow{width:64px;height:64px;border-radius:50%;background:var(--accent-soft);display:grid;place-items:center}
.arrow svg{width:38px;height:38px;transition:transform .25s ease}
.arrow.idle{background:var(--sunk)}
.arrow.idle svg{opacity:.35}
.arrived{background:var(--done-soft);color:var(--done);border-radius:6px;padding:8px 12px;font-weight:600}
.gps{font-family:var(--f-mono);font-size:.78rem;color:var(--muted)}
.gps.on{color:var(--done)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:.88rem}
.chips button:hover{border-color:var(--accent)}
.dir-list{columns:2 240px;column-gap:24px;margin:8px 0 0;padding:0;list-style:none}
.dir-list li{break-inside:avoid;padding:2px 0}
.dir-list button{background:none;border:0;padding:2px 0;text-align:left;color:var(--ink)}
.dir-list button:hover{color:var(--accent)}
.dir-list .mono{font-size:.75rem;color:var(--muted);margin-left:6px}
details summary{cursor:pointer;font-weight:600}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;font:inherit;cursor:pointer}
/* class pins on the map */
.cls-pin{background:none;border:0}
.cpw{position:absolute;left:0;top:0;transform:translate(-50%,calc(-100% - 14px));display:grid;gap:3px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:5px 7px;box-shadow:0 2px 8px rgba(0,0,0,.22);white-space:nowrap;font-size:.74rem;color:var(--ink);cursor:pointer}
.cpw::after{content:"";position:absolute;left:50%;bottom:-7px;margin-left:-7px;border:7px solid transparent;border-bottom:0;border-top-color:var(--surface);filter:drop-shadow(0 1px 0 var(--line))}
.cp{display:flex;gap:6px;align-items:center}
.cp .n{background:var(--accent);color:var(--surface);border-radius:50%;width:17px;height:17px;display:grid;place-items:center;font-weight:700;font-size:.66rem;flex:none}
.cp b{font-family:var(--f-mono);font-weight:500}
.cp .t{font-family:var(--f-mono);color:var(--muted)}
.cp .r{font-family:var(--f-mono);font-weight:600;background:var(--accent-soft);color:var(--ink);border-radius:4px;padding:0 5px}
.cp.now .n{background:var(--done)}
.cp.now .t{color:var(--done);font-weight:600}
.cp.past{opacity:.45}
.mc-list{display:grid;gap:0}
.mc-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.mc-row:first-child{border-top:0}
.mc-row .num{background:var(--accent);color:var(--surface);border-radius:50%;width:24px;height:24px;display:grid;place-items:center;font-weight:700;font-size:.78rem}
.mc-row.past{opacity:.55}
.mc-row.now .num{background:var(--done)}
.mc-when{font-family:var(--f-mono);font-size:.88rem}
.mc-status{font-size:.8rem;font-weight:600;color:var(--accent)}
.mc-row.now .mc-status{color:var(--done)}
.mc-row.past .mc-status{color:var(--muted)}
.locbtn{width:40px;height:40px;border-radius:8px;border:2px solid rgba(0,0,0,.2);background:#fff;display:grid;place-items:center;cursor:pointer;padding:0;color:#333}
.locbtn svg{width:22px;height:22px}
.locbtn.on{color:#1D4ED8}
.locbtn.wait svg{animation:locspin 1.2s linear infinite}
@keyframes locspin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.locbtn.wait svg{animation:none}}

main{padding-block:24px 64px}
section.panel{display:grid;grid-template-columns:minmax(0,1fr);gap:24px}
section.panel>*,.card,.term,.year{min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.grid2{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:24px}
@media (max-width:820px){.grid2{grid-template-columns:minmax(0,1fr)}}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 14px;font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.small{padding:4px 10px;font-size:.85rem}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);border-color:var(--line)}

/* instrument tiles */
.gauges{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:760px){.gauges{grid-template-columns:repeat(2,minmax(0,1fr))}}
.gauge{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:4px}
.gauge .v{font-family:var(--f-display);font-size:1.9rem;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.gauge .v small{font-size:.9rem;color:var(--muted);font-weight:500}
.bar{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.bar>span{display:block;height:100%;background:var(--accent);border-radius:3px}
.bar.done>span{background:var(--done)}

/* route */
.route-scroll{overflow-x:auto;padding-bottom:6px}
.route{display:flex;align-items:flex-start;min-width:max-content;padding:8px 4px 0}
.wp{display:grid;justify-items:center;gap:6px;width:86px;position:relative}
.wp::before{content:"";position:absolute;top:17px;left:-50%;width:100%;height:2px;background:var(--line);z-index:0}
.wp:first-child::before{display:none}
.wp.past::before{background:var(--done)}
.wp .dot{width:36px;height:36px;border-radius:50%;border:2px solid var(--line);background:var(--surface);z-index:1;display:grid;place-items:center;font-family:var(--f-mono);font-size:.7rem;font-weight:500}
.wp.past .dot{border-color:var(--done);background:var(--done-soft);color:var(--done)}
.wp.now .dot{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.wp .t{font-size:.75rem;text-align:center;line-height:1.25;color:var(--muted)}
.wp.now .t{color:var(--ink);font-weight:600}
.wp.coop .dot{border-style:dashed}

.list{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.li{display:flex;gap:10px;align-items:flex-start}
.li .code{font-family:var(--f-mono);font-size:.82rem;color:var(--muted);min-width:74px}

/* plan */
.plan-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.year{display:grid;gap:10px}
.year-head{display:flex;align-items:baseline;gap:12px;border-bottom:1px solid var(--line);padding-bottom:6px}
.year-head h3{font-size:1.1rem;text-transform:uppercase;letter-spacing:.08em}
.terms{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.term{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:grid;align-content:start}
.term-head{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.term-head b{font-family:var(--f-display);font-weight:600}
.term-head .mono{font-size:.8rem;color:var(--muted)}
.course{display:grid;grid-template-columns:auto 76px minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--line)}
.course:last-child{border-bottom:0}
.course .code{font-family:var(--f-mono);font-size:.8rem}
.course .title{min-width:0;font-size:.92rem}
.course .cr{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);text-align:right;white-space:nowrap}
.course .extra{grid-column:2/-1;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{border:1px solid var(--line);border-radius:999px;padding:2px 9px;font-size:.72rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.done{background:var(--done-soft);color:var(--done);border-color:transparent}
.chip.progress{background:var(--prog-soft);color:var(--prog);border-color:transparent}
.status-btn{background:none;border:0;padding:0}
select.grade{border:1px solid var(--line);border-radius:5px;background:var(--surface);padding:1px 4px;font-size:.8rem}
.edit input{border:1px solid var(--line);border-radius:5px;background:var(--bg);padding:3px 6px;width:100%;min-width:0}
.course.edit{grid-template-columns:76px minmax(0,1fr) 52px auto}
.empty-term{padding:12px 14px;color:var(--muted);font-size:.88rem}
textarea{width:100%;min-height:180px;border:1px solid var(--line);border-radius:6px;background:var(--bg);padding:10px;font-family:var(--f-mono);font-size:.82rem}
.note{background:var(--accent-soft);border-radius:var(--r);padding:12px 16px;font-size:.9rem}
.note b{color:var(--accent)}

/* study */
.study{display:grid;grid-template-columns:260px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:760px){.study{grid-template-columns:minmax(0,1fr)}}
.topics{display:grid;gap:4px}
.topic-btn{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;text-align:left;background:none;border:1px solid transparent;border-radius:6px;padding:7px 10px}
.topic-btn:hover{background:var(--surface);border-color:var(--line)}
.topic-btn[aria-pressed="true"]{background:var(--surface);border-color:var(--accent)}
.topic-btn .bar{grid-column:1/-1;height:4px}
.topic-btn .pct{font-family:var(--f-mono);font-size:.75rem;color:var(--muted)}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:6px 16px;margin:0;padding:0;list-style:none}
.checks label{display:flex;gap:8px;align-items:flex-start;cursor:pointer;font-size:.92rem}
.checks input{margin-top:4px;accent-color:var(--done)}
.flash{border:1px solid var(--line);border-radius:var(--r);background:var(--bg);padding:22px;display:grid;gap:14px;min-height:190px;align-content:center}
.flash .q{font-family:var(--f-display);font-size:1.25rem;font-weight:600}
.flash .a{font-size:1.02rem;border-top:1px dashed var(--line);padding-top:12px}
.boxes{display:flex;gap:4px}
.boxes span{flex:1;height:22px;border-radius:4px;background:var(--sunk);font-family:var(--f-mono);font-size:.7rem;display:grid;place-items:center;color:var(--muted)}

/* career */
.tracks{display:flex;flex-wrap:wrap;gap:8px}
.track-btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:500}
.track-btn[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
.timeline{display:grid;gap:0}
.tl-year{display:grid;grid-template-columns:90px minmax(0,1fr);gap:16px;padding:14px 0;border-top:1px solid var(--line)}
.tl-year:first-child{border-top:0}
.tl-year .yr{font-family:var(--f-display);font-weight:600}
@media (max-width:560px){.tl-year{grid-template-columns:minmax(0,1fr);gap:6px}}

/* timer */
.timer{display:grid;justify-items:center;gap:14px;text-align:center}
.clock{font-family:var(--f-display);font-size:clamp(3.2rem,12vw,5.5rem);font-weight:600;font-variant-numeric:tabular-nums;line-height:1}
.mode{font-family:var(--f-mono);font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;align-items:end;height:150px}
.week .col{display:grid;grid-template-rows:auto 1fr auto;height:100%;gap:4px;text-align:center}
.week .stem{display:flex;align-items:flex-end}
.week .fill{width:100%;background:var(--accent);border-radius:4px 4px 0 0;min-height:2px}
.week .col.today .fill{background:var(--done)}
.week .n{font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}
.week .d{font-size:.75rem;color:var(--muted)}
.field{display:grid;gap:4px}
.field select,.field input{border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:6px 8px}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--accent-soft);padding:10px 12px;border-radius:6px}
@media (prefers-reduced-motion:no-preference){.bar>span,.week .fill{transition:width .4s ease,height .4s ease}}

/* schedule */
:root{--c1:#B45309;--c2:#0F766E;--c3:#1D4ED8;--c4:#9D174D;--c5:#6D28D9;--c6:#15803D}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--c1:#F2A33A;--c2:#34D3BE;--c3:#82A6F8;--c4:#F472B6;--c5:#B39DFA;--c6:#4ADE80}}
:root[data-theme="dark"]{--c1:#F2A33A;--c2:#34D3BE;--c3:#82A6F8;--c4:#F472B6;--c5:#B39DFA;--c6:#4ADE80}
.pill{font-family:var(--f-mono);font-size:.78rem;font-weight:500;background:var(--sunk);border-radius:4px;padding:1px 7px;white-space:nowrap}
.nextc{display:grid;gap:8px}
.nx-main{display:flex;flex-wrap:wrap;gap:8px;align-items:baseline}
.nx-main b{font-family:var(--f-display);font-size:1.25rem;font-weight:600}
.nx-when{font-family:var(--f-mono);font-size:.95rem;color:var(--accent);font-weight:500}
.nx-room{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
a{color:var(--accent)}
.wk{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:10px}
.wk-col{display:grid;gap:8px;align-content:start;min-width:0}
.wk-col h4{margin:0;font-family:var(--f-display);font-size:.95rem;padding-bottom:4px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
.wk-col.today h4{color:var(--accent);border-bottom-color:var(--accent)}
.blk{border:1px solid var(--line);border-radius:6px;padding:8px 10px;background:var(--surface);display:grid;gap:2px;min-width:0}
.blk .tm{font-family:var(--f-mono);font-size:.76rem;color:var(--muted)}
.blk .rm{font-size:.82rem;color:var(--muted);overflow-wrap:anywhere}
.blk.live{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.daychips{display:none;gap:6px;flex-wrap:wrap}
.daychips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-weight:500}
.daychips button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
@media (max-width:700px){.wk{grid-template-columns:minmax(0,1fr)}.wk-col{display:none}.wk-col.sel{display:grid}.daychips{display:flex}}
.cls-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
.cls-row:first-child{border-top:0}
.cls-meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.85rem;color:var(--muted)}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.form-grid .field input,.form-grid .field select{width:100%}
.daypick{display:flex;flex-wrap:wrap;gap:6px}
.daypick label{display:flex;gap:4px;align-items:center;border:1px solid var(--line);border-radius:6px;padding:4px 8px;cursor:pointer}
.steps{margin:0;padding-left:20px;font-size:.9rem}

const uid=()=>Math.random().toString(36).slice(2,10);
function starterPlan(){return STARTER.map(([y,t,c,ti,cr])=>({id:uid(),year:y,term:t,code:c,title:ti,cr,status:'planned',grade:''}))}
function freshState(){return {v:1,starter:true,plan:starterPlan(),concepts:{},cards:{},career:{track:null,checks:{}},log:{},topic:null,schedule:{active:null,terms:{}},mapDest:null,mapPins:{}}}
function normClass(c){return {id:String(c.id||uid()),code:String(c.code||'').slice(0,20),title:String(c.title||'').slice(0,120),kind:String(c.kind||'').slice(0,30),
  days:Array.isArray(c.days)?[...new Set(c.days.map(Number).filter(d=>d>=0&&d<=6))].sort((a,b)=>a-b):[],
  start:/^\d{2}:\d{2}$/.test(c.start)?c.start:'',end:/^\d{2}:\d{2}$/.test(c.end)?c.end:'',room:String(c.room||'').slice(0,120),instructor:String(c.instructor||'').slice(0,80)}}
function normSchedule(s){
  const out={active:null,terms:{}}; if(!s||typeof s!=='object') return out;
  if(s.terms&&typeof s.terms==='object') for(const [k,t] of Object.entries(s.terms)){ if(t&&Array.isArray(t.classes)&&/^\d{4}-(Spring|Summer|Fall)$/.test(k)) out.terms[k]={label:String(t.label||k),classes:t.classes.filter(Boolean).map(normClass)} }
  out.active=out.terms[s.active]?s.active:(Object.keys(out.terms).sort().pop()||null); return out;
}
function normalize(s){
  const f=freshState(); if(!s||typeof s!=='object') return f;
  return {v:1,starter:!!s.starter,plan:Array.isArray(s.plan)?s.plan.filter(c=>c&&c.id).map(c=>({id:String(c.id),year:+c.year||1,term:TERMS.includes(c.term)?c.term:'Fall',code:String(c.code||''),title:String(c.title||''),cr:Math.max(0,+c.cr||0),status:STATUS.includes(c.status)?c.status:'planned',grade:GRADES[c.grade]!==undefined?c.grade:''})):f.plan,
    concepts:s.concepts&&typeof s.concepts==='object'?s.concepts:{},cards:s.cards&&typeof s.cards==='object'?s.cards:{},
    /* The career path stays exactly as the user set it. Older saves defaulted to 'swe' without a choice, so that alone doesn't count as chosen. */
    career:(()=>{const ok=s.career&&TRACKS.some(t=>t.id===s.career.track)&&(s.career.chosen||s.career.track!=='swe');
      return {track:ok?s.career.track:null,chosen:!!ok,checks:(s.career&&s.career.checks)||{}}})(),
    log:s.log&&typeof s.log==='object'?s.log:{},topic:s.topic||null,schedule:normSchedule(s.schedule),
    mapDest:typeof s.mapDest==='string'?s.mapDest:null,
    mapPins:s.mapPins&&typeof s.mapPins==='object'?Object.fromEntries(Object.entries(s.mapPins).filter(([k,v])=>Array.isArray(v)&&v.length===2&&isFinite(v[0])&&isFinite(v[1]))):{}};
}

/* ---------- persistence: account db (private per viewer) with browser fallback ---------- */
let dbRef=null, saveTimer=null, saveChain=Promise.resolve(), dirty=false;
const saveEl=document.getElementById('save');
function badge(kind,text){saveEl.className='save'+(kind?' '+kind:'');saveEl.lastElementChild.textContent=text}
function persist(){
  dirty=true;
  try{localStorage.setItem(LS,JSON.stringify(state))}catch(e){}
  if(!dbRef){return}
  badge('','Saving…');
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{
    const body={json:JSON.stringify(state),updated:Date.now()};
    saveChain=saveChain.then(()=>dbRef.set(body)).then(()=>badge('ok','Saved to your account')).catch(e=>{
      badge('err',e&&e.code==='quota_exceeded'?'Account storage is full':'Saved on this device');
    });
  },700);
}
async function initStore(){
  try{
    if(!window.claude||typeof window.claude.use!=='function') return;
    const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    if(!db||!user) return;
    const id=await user.id(); if(!id) return;
    const ref=db.doc('data/users/'+id+'/state');
    const snap=await Promise.race([ref.get(),new Promise((_,rej)=>setTimeout(()=>rej({code:'timeout'}),10000))]);
    dbRef=ref;
    if(snap.exists&&!dirty){
      const d=snap.data(); if(d&&typeof d.json==='string'){state=normalize(JSON.parse(d.json)); try{localStorage.setItem(LS,d.json)}catch(e){} render();}
      badge('ok','Saved to your account');
    }else{ persist(); }
  }catch(e){ badge('', 'Saved on this device'); }
}

/* ---------- helpers ---------- */
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const app=document.getElementById('app');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const dayKey=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
function semesters(){
  const map=new Map();
  for(const c of state.plan){const k=c.year+'|'+c.term; if(!map.has(k)) map.set(k,{year:c.year,term:c.term,courses:[]}); map.get(k).courses.push(c)}
  return [...map.values()].sort((a,b)=>a.year-b.year||TERMS.indexOf(a.term)-TERMS.indexOf(b.term));
}
const isCoop=c=>/co-?op/i.test(c.code+' '+c.title);
function stats(){
  let total=0,done=0,prog=0,q=0,gcr=0;
  for(const c of state.plan){total+=c.cr; if(c.status==='done'){done+=c.cr; if(c.grade&&c.cr>0){q+=GRADES[c.grade]*c.cr; gcr+=c.cr}} if(c.status==='progress') prog+=c.cr}
  return {total,done,prog,gpa:gcr?q/gcr:null};
}
function currentSem(){
  const sems=semesters();
  return sems.find(s=>s.courses.some(c=>c.status==='progress'))||sems.find(s=>s.courses.some(c=>c.status!=='done'))||sems[sems.length-1]||null;
}
function topicsFor(c){return TOPICS.filter(t=>t.re.test(c.code+' '+c.title)).map(t=>t.id)}
function topicMastery(t){
  const ch=(state.concepts[t.id]||[]).length/t.concepts.length;
  const cb=t.cards.reduce((a,_,i)=>a+Math.min(4,state.cards[t.id+':'+i]||0),0)/(t.cards.length*4);
  return Math.round((ch*0.5+cb*0.5)*100);
}
function weekMinutes(){let m=0;const d=new Date();for(let i=0;i<7;i++){const k=dayKey(d);m+=(state.log[k]&&state.log[k].total)||0;d.setDate(d.getDate()-1)}return m}
function streak(){let n=0;const d=new Date();if(!(state.log[dayKey(d)]&&state.log[dayKey(d)].total)) d.setDate(d.getDate()-1);while(state.log[dayKey(d)]&&state.log[dayKey(d)].total){n++;d.setDate(d.getDate()-1)}return n}
function addMinutes(min,course){
  const k=today(); const e=state.log[k]||{total:0,by:{}}; e.total+=min; if(course) e.by[course]=(e.by[course]||0)+min; state.log[k]=e;
  const cutoff=new Date(); cutoff.setDate(cutoff.getDate()-180); const ck=dayKey(cutoff);
  for(const key of Object.keys(state.log)) if(key<ck) delete state.log[key];
  persist();
}
const pct=(a,b)=>b?Math.round(a/b*100):0;

/* ---------- views ---------- */

  return `<section class="panel">

  ${state.starter?`<div class="note"><b>Starter plan loaded.</b> The UofL catalog was unreachable when this app was built, so the plan uses placeholder codes like <span class="mono">CSE 3xx</span>. Open <b>Flight plan → Import from catalog</b> and paste the flight plan text from the <a href="https://catalog.louisville.edu/undergraduate/majors/computer-engineering-science-bs/#flightplantext" target="_blank" rel="noopener">catalog page</a> to load your exact courses.</div>`:''}
  <div class="gauges">
    <div class="gauge"><span class="label">Credits complete</span><span class="v">${s.done}<small> / ${s.total}</small></span><div class="bar done"><span style="width:${pct(s.done,s.total)}%"></span></div></div>
    <div class="gauge"><span class="label">GPA</span><span class="v">${s.gpa===null?'—':s.gpa.toFixed(2)}</span><span class="muted" style="font-size:.8rem">${s.gpa===null?'Add grades to finished courses':'From graded, finished courses'}</span></div>
    <div class="gauge"><span class="label">Current leg</span><span class="v" style="font-size:1.4rem">${cur?('Year '+cur.year+' · '+cur.term):'—'}</span><span class="muted" style="font-size:.8rem">${s.prog} credits in progress</span></div>
    <div class="gauge"><span class="label">Study this week</span><span class="v">${Math.round(weekMinutes()/6)/10}<small> h</small></span><span class="muted" style="font-size:.8rem">${streak()} day streak</span></div>
  </div>
  <div class="card"><div class="row" style="justify-content:space-between;margin-bottom:8px"><h2>Route to graduation</h2><span class="label">${sems.length} legs</span></div>
    <div class="route-scroll"><div class="route">${sems.map((sm,i)=>{const cr=sm.courses.reduce((a,c)=>a+c.cr,0);const dn=sm.courses.reduce((a,c)=>a+(c.status==='done'?c.cr:0),0);const coop=sm.courses.every(isCoop);const allDone=sm.courses.every(c=>c.status==='done');
      const cls=(allDone?'past':'')+(i===curIdx&&!allDone?' now':'')+(coop?' coop':'');
      return `<div class="wp ${cls}"><div class="dot">${coop?'CO':pct(dn,cr)+'%'}</div><div class="t">Y${sm.year}<br>${sm.term}</div></div>`}).join('')}</div></div>
  </div>
  <div class="grid2">
    <div class="card" style="display:grid;gap:14px">
      <h2>On your desk now</h2>
      ${inProg.length?`<ul class="list">${inProg.map(c=>`<li class="li"><span class="code">${esc(c.code)}</span><span>${esc(c.title)} <span class="muted mono" style="font-size:.8rem">· ${c.cr} cr</span></span></li>`).join('')}</ul>`:`<p class="muted" style="margin:0">No courses marked in progress. On the Flight plan tab, click a course's status chip to set it to <b>In progress</b>.</p>`}
      ${studyTopics.length?`<div><div class="label" style="margin-bottom:6px">Weakest topics in current courses</div><div class="topics">${studyTopics.map(t=>{const m=topicMastery(t);return `<button class="topic-btn" data-act="goTopic" data-id="${t.id}"><span>${esc(t.name)}</span><span class="pct">${m}%</span><span class="bar"><span style="width:${m}%"></span></span></button>`}).join('')}</div></div>`:''}
    </div>
    <div class="card" style="display:grid;gap:14px;align-content:start">
      <h2>Career checkpoints · Year ${yr}</h2>
      ${ms.length?`<ul class="list">${ms.map(x=>`<li><label class="li" style="cursor:pointer"><input type="checkbox" data-act="check" data-k="${x.k}" style="margin-top:4px;accent-color:var(--done)"><span>${esc(x.m)}</span></label></li>`).join('')}</ul>`:`<p class="muted" style="margin:0">Every Year ${yr} checkpoint is done.</p>`}
      <p class="muted" style="margin:0;font-size:.88rem">${track?`Your career path: <b style="color:var(--ink)">${esc(track.name)}</b>.`:`No career path chosen yet. <button class="linkbtn" data-act="goCareer">Choose one</button>`}</p>

function courseRow(c){

    <button class="btn ghost small" data-act="del" data-id="${c.id}" aria-label="Remove ${esc(c.code)}">✕</button></div>`;
  return `<div class="course">
    <button class="status-btn" data-act="cycle" data-id="${c.id}" title="Click to change status"><span class="chip ${c.status}">${STATUS_LABEL[c.status]}</span></button>

}

      <div class="row"><button class="btn" data-act="parse">Preview import</button>${prev?`<span class="muted">${prev.length} courses found across ${new Set(prev.map(c=>c.year+c.term)).size} terms.</span>`:''}</div>
      ${prev&&prev.length?`<div style="max-height:240px;overflow:auto;border:1px solid var(--line);border-radius:6px">${prev.map(c=>`<div class="course" style="grid-template-columns:84px 76px minmax(0,1fr) auto"><span class="mono muted" style="font-size:.78rem">Y${c.year} ${c.term}</span><span class="code">${esc(c.code)}</span><span class="title">${esc(c.title)}</span><span class="cr">${c.cr} cr</span></div>`).join('')}</div>
        <div class="row"><button class="btn primary" data-act="applyImport">Replace my plan with these ${prev.length} courses</button><span class="muted" style="font-size:.85rem">Status and grades carry over for matching course codes.</span></div>`:''}

  </section>`;

function vStudy(){
  const inProg=state.plan.filter(c=>c.status==='progress');
  const curIds=[...new Set(inProg.flatMap(topicsFor))];
  const planIds=new Set(state.plan.flatMap(topicsFor));
  let sel=TOPIC_BY_ID[state.topic]||TOPIC_BY_ID[curIds[0]]||TOPICS[0];
  const btn=t=>{const m=topicMastery(t);return `<button class="topic-btn" data-act="topic" data-id="${t.id}" aria-pressed="${t.id===sel.id}"><span>${esc(t.name)}</span><span class="pct">${m}%</span><span class="bar"><span style="width:${m}%"></span></span></button>`};
  const others=TOPICS.filter(t=>!curIds.includes(t.id));
  const checked=new Set(state.concepts[sel.id]||[]);
  const linked=state.plan.filter(c=>topicsFor(c).includes(sel.id));
  // pick card: lowest box, stable within reveal
  let key=ui.cardKey;
  if(!key||!key.startsWith(sel.id+':')){key=pickCard(sel)}
  ui.cardKey=key;
  const ci=+key.split(':')[1], card=sel.cards[ci], box=state.cards[key]||0;
  const boxCounts=[0,0,0,0,0]; sel.cards.forEach((_,i)=>boxCounts[Math.min(4,state.cards[sel.id+':'+i]||0)]++);
  return `<section class="panel"><div class="study">
    <aside class="topics">
      ${curIds.length?`<div class="label" style="padding:4px 10px">From courses in progress</div>${curIds.map(id=>btn(TOPIC_BY_ID[id])).join('')}<div class="label" style="padding:12px 10px 4px">All topics</div>`:`<div class="label" style="padding:4px 10px">Topics</div>`}
      ${others.map(t=>btn(t)+(planIds.has(t.id)?'':'')).join('')}

    <div style="display:grid;gap:20px;min-width:0">
      <div class="card" style="display:grid;gap:12px">
        <div class="row" style="justify-content:space-between"><h2>${esc(sel.name)}</h2><span class="mono muted">${topicMastery(sel)}% mastered</span></div>
        ${linked.length?`<p class="muted" style="margin:0;font-size:.88rem">In your plan: ${linked.map(c=>`<span class="mono">${esc(c.code)}</span> ${esc(c.title)}`).join(' · ')}</p>`:`<p class="muted" style="margin:0;font-size:.88rem">Not linked to a course in your plan yet. Useful for interviews or electives.</p>`}
        <div class="label">Concepts · tick when you can explain it without notes</div>
        <ul class="checks">${sel.concepts.map((c,i)=>`<li><label><input type="checkbox" data-act="concept" data-id="${sel.id}" data-i="${i}"${checked.has(i)?' checked':''}><span>${esc(c)}</span></label></li>`).join('')}</ul>
      </div>
      <div class="card" style="display:grid;gap:12px">
        <div class="row" style="justify-content:space-between"><h3>Flashcard drill</h3><span class="mono muted" style="font-size:.8rem">Card ${ci+1} of ${sel.cards.length} · box ${box}</span></div>
        <div class="flash"><div class="q">${esc(card[0])}</div>${ui.reveal?`<div class="a">${esc(card[1])}</div>`:''}</div>
        <div class="row">${ui.reveal?`<button class="btn" data-act="miss">Missed it</button><button class="btn primary" data-act="hit">Got it</button>`:`<button class="btn primary" data-act="reveal">Show answer</button><button class="btn ghost" data-act="skip">Skip</button>`}</div>
        <div><div class="label" style="margin-bottom:4px">Cards per box (0 = new or missed, 4 = solid)</div><div class="boxes">${boxCounts.map((n,i)=>`<span style="${n?`background:${i>=3?'var(--done-soft)':i>=1?'var(--prog-soft)':'var(--accent-soft)'};color:var(--ink)`:''}">${i}: ${n}</span>`).join('')}</div></div>
      </div>
    </div></div></section>`;
}
function pickCard(t){
  let min=99, opts=[]; t.cards.forEach((_,i)=>{const b=state.cards[t.id+':'+i]||0; if(b<min){min=b;opts=[i]} else if(b===min) opts.push(i)});
  const prev=ui.cardKey&&ui.cardKey.startsWith(t.id+':')?+ui.cardKey.split(':')[1]:-1;
  const pool=opts.length>1?opts.filter(i=>i!==prev):opts;
  return t.id+':'+pool[Math.floor(Math.random()*pool.length)];
}

function checkList(items,prefix){return `<ul class="list">${items.map((m,i)=>{const k=prefix+i;return `<li><label class="li" style="cursor:pointer"><input type="checkbox" data-act="check" data-k="${k}"${state.career.checks[k]?' checked':''} style="margin-top:4px;accent-color:var(--done)"><span>${esc(m)}</span></label></li>`}).join('')}</ul>`}
function countChecked(prefix,n){let c=0;for(let i=0;i<n;i++) if(state.career.checks[prefix+i]) c++;return c}

        ${checkList(t.skills,'sk:'+t.id+':')}
        <div class="row" style="justify-content:space-between"><h3>Portfolio projects</h3><span class="mono muted">${countChecked('pj:'+t.id+':',t.projects.length)}/${t.projects.length}</span></div>

/* timer (not persisted) */
const T={mode:'focus',len:25,brk:5,left:25*60,running:false,end:0,course:'',iv:null};
function vTimer(){
  const opts=state.plan.filter(c=>c.status==='progress');
  const list=(opts.length?opts:state.plan.filter(c=>c.cr>0&&!isCoop(c)));
  if(!T.course&&list[0]) T.course=list[0].code;
  const days=[];const d=new Date();d.setDate(d.getDate()-6);
  for(let i=0;i<7;i++){const k=dayKey(d);days.push({k,label:d.toLocaleDateString(undefined,{weekday:'short'}),m:(state.log[k]&&state.log[k].total)||0});d.setDate(d.getDate()+1)}
  const max=Math.max(60,...days.map(x=>x.m));
  const by={};for(const x of days){const e=state.log[x.k];if(e&&e.by)for(const[c,m]of Object.entries(e.by)) by[c]=(by[c]||0)+m}
  const top=Object.entries(by).sort((a,b)=>b[1]-a[1]).slice(0,5);

/* Pasted text: the portal's class list (tab-separated or one cell per line) or free lines like "CSE 310 MWF 10:00-10:50 Duthie 117". */
function parseSchedule(text){
  const lines=String(text).split(/\r?\n/).map(l=>l.replace(/ /g,' ').trim());
  const tm=String(text).match(/\b(Spring|Summer|Fall)\s*(?:Semester|Term)?\s*(20\d{2})\b/i);
  const term=tm?{term:tm[1][0].toUpperCase()+tm[1].slice(1).toLowerCase(),year:+tm[2]}:null;

    const tr=findTime(t);

    if(!days) for(let j=i-1;j>=Math.max(0,i-2);j--){const d=parseDays(lines[j]);if(d){days=d;break}}
    if(!days) continue;
    const head=words.slice(0,words.length-used).join(' ');
    let code=course?course.code:'',title=course?course.title:'';
    const cm=head.match(CODE_RE);
    if(cm){const nc=cm[1]+' '+cm[2];
      let tt=head.slice(head.indexOf(cm[0])+cm[0].length).replace(/^\s*-?\s*\d{1,3}[A-Z]?\b/,'').replace(/\s*\b(lecture|lec|laboratory|lab|discussion|dis|seminar|sem|recitation|rec|studio)\b\s*$/i,'').replace(/^[\s\-–:|]+|[\s\-–:|]+$/g,'');

}

    if(!cur) continue;const i=l.indexOf(':');if(i<0) continue;

  }
  const out=[];let first=null;

function schedClick(el){
  const a=el.dataset.act,S=state.schedule,U=ui.sched,id=el.dataset.id;
  const T=S.active?S.terms[S.active]:null;
  U.msg='';
  switch(a){
    case 's-import':U.importOpen=!U.importOpen;U.form=null;break;
    case 's-newterm':U.newOpen=!U.newOpen;break;
    case 's-createterm':{const t=document.getElementById('sn-term').value,y=+document.getElementById('sn-year').value;if(y<2000||y>2100)return;S.active=ensureTerm(t,y);U.newOpen=false;persist();break}
    case 's-preview':U.text=document.getElementById('schedText').value;U.preview=readSchedule(U.text);U.target=pickTarget(U.preview);break;
    case 's-apply':{
      const P=U.preview;if(!P||!P.classes.length) return;
      let key=document.getElementById('schedTarget').value;
      if(key==='new'){const t=document.getElementById('sn2-term').value,y=+document.getElementById('sn2-year').value;if(y<2000||y>2100)return;key=ensureTerm(t,y)}
      const term=S.terms[key];
      const add=P.classes.map(c=>normClass({...c,id:uid()}));
      term.classes=document.getElementById('s-replace').checked?add:mergeClasses(term.classes.concat(add));
      const n=document.getElementById('s-mark').checked?markPlan(add):0;
      S.active=key;U.preview=null;U.text='';U.importOpen=false;
      U.msg=`Saved ${add.length} class${add.length===1?'':'es'} to ${term.label}.`+(n?` ${n} course${n===1?' is':'s are'} now In progress in your flight plan.`:'');
      persist();break;}
    case 's-add':if(!T){const g=guessTerm();S.active=ensureTerm(g.term,g.year);persist()}U.form={id:null,code:'',title:'',kind:'Lecture',start:'09:00',end:'09:50',room:'',instructor:'',days:[]};U.err='';U.importOpen=false;break;
    case 's-edit':{const c=T&&T.classes.find(x=>x.id===id);if(c){U.form={...c,days:[...c.days]};U.err='';U.importOpen=false;window.scrollTo(0,0)}break}
    case 's-cancel':U.form=null;U.err='';break;
    case 's-save':{
      const v=k=>document.getElementById(k).value.trim();
      const f={id:U.form.id,code:v('sf-code').toUpperCase(),title:v('sf-title'),kind:v('sf-kind'),start:v('sf-start'),end:v('sf-end'),room:v('sf-room'),instructor:v('sf-instr'),days:[0,1,2,3,4,5,6].filter(d=>document.getElementById('sf-d'+d).checked)};
      U.form=f;
      if(!f.code){U.err='Enter a course code, such as CSE 310.';break}
      if(!f.days.length){U.err='Pick at least one day.';break}
      if(!/^\d{2}:\d{2}$/.test(f.start)||!/^\d{2}:\d{2}$/.test(f.end)||toMin(f.end)<=toMin(f.start)){U.err='The end time must be after the start time.';break}
      if(!T) break;
      if(f.id){const i=T.classes.findIndex(x=>x.id===f.id);if(i>=0)T.classes[i]=normClass(f)}else T.classes.push(normClass({...f,id:uid()}));
      U.form=null;U.err='';persist();break;}
    case 's-del':if(T){T.classes=T.classes.filter(x=>x.id!==id);persist()}break;
    case 's-day':U.day=+el.dataset.d;break;
    case 's-delterm':U.confirmDel=true;break;
    case 's-deltermno':U.confirmDel=false;break;
    case 's-deltermyes':if(S.active){delete S.terms[S.active];const ks=Object.keys(S.terms).sort((a,b)=>termOrder(a)-termOrder(b));S.active=ks.pop()||null;U.confirmDel=false;persist()}break;
    default:return;
  }
  render();
}
function pickTarget(P){
  const t=P&&P.term;if(t){const k=termKey(t.term,t.year);return state.schedule.terms[k]?k:'new'}
  return state.schedule.active||'new';
}

function matchBuilding(text){
  if(!text) return null;
  const low=' '+String(text).toLowerCase().replace(/[^a-z0-9& ]/g,' ').replace(/\s+/g,' ')+' ';const comp=compact(text);

    const hit=ca.length<=4?low.includes(' '+a.toLowerCase()+' '):comp.includes(ca);

/* Classes on the map: numbered pins with start and end times for one day */
function dayList(d){const t=state.schedule.terms[state.schedule.active];if(!t) return [];return t.classes.filter(c=>c.days.includes(d)).sort((a,b)=>toMin(a.start)-toMin(b.start))}
function mapDay(){
  if(ui.mapDay!==undefined&&ui.mapDay!==null) return ui.mapDay;
  const t=state.schedule.terms[state.schedule.active],today=new Date().getDay();
  if(!t||!t.classes.length) return today;
  const mins=new Date().getHours()*60+new Date().getMinutes();
  if(dayList(today).some(c=>toMin(c.end)>mins)) return today;
  const n=nextUp(t.classes);return n?(today+n.off)%7:today;

function classStatuses(d,list){
  const today=new Date().getDay(),mins=new Date().getHours()*60+new Date().getMinutes();
  let nextMarked=false;
  return list.map(c=>{
    if(d!==today) return {key:'',text:''};
    if(toMin(c.start)<=mins&&mins<toMin(c.end)) return {key:'now',text:`Now · ends in ${dur(toMin(c.end)-mins)}`};
    if(toMin(c.end)<=mins) return {key:'past',text:'Done'};
    if(!nextMarked){nextMarked=true;return {key:'next',text:`Starts in ${dur(toMin(c.start)-mins)}`}}
    return {key:'',text:`Starts in ${dur(toMin(c.start)-mins)}`};
  });
}
/* Which classes the map shows: finished ones never; by default only the class in progress and the next one to start */
function shownIdx(list,st){
  const idx=[];let nextTaken=false;
  list.forEach((c,i)=>{
    if(st[i].key==='past') return;
    if(ui.mapAll||st[i].key==='now') {idx.push(i);return}
    if(!nextTaken){nextTaken=true;idx.push(i)}
  });

}
/* Room number from a room string, e.g. "Duthie Center 117" -> "Rm 117", "Natural Sciences Bldg Room 112A" -> "Rm 112A" */
function roomNo(room){
  const m=String(room||'').match(/(?:room|rm\.?|#)?\s*([A-Z]?-?\d{1,4}[A-Z]?)\s*$/i);

function drawClasses(){

  if(!list.length) return '';
  return `<div style="display:grid;gap:6px"><span class="label">${label}</span><div class="chips">${list.map(c=>{const b=matchBuilding(c.room);
    return b?`<button data-act="m-dest" data-b="${b.id}"><b class="mono" style="font-size:.8rem">${esc(c.code)}</b> ${fmt12(c.start)} · ${esc(b.name.replace(/ \(.*\)$/,''))}</button>`:`<button disabled title="Room not recognized: ${esc(c.room||'none')}" style="opacity:.6"><b class="mono" style="font-size:.8rem">${esc(c.code)}</b> ${fmt12(c.start)} · ${esc(c.room||'no room')}</button>`}).join('')}</div></div>`;
}
function vMap(){
  if(IS_ARTIFACT){
    return `<section class="panel"><div><h2>Campus map</h2><p class="muted" style="margin:2px 0 0">Live GPS guidance runs in the Android app and on the website, not inside Claude.</p></div>
      <div class="note"><b>Open the app for live guidance.</b> Install the Android app from <a href="https://github.com/PhuongNguyen210295/cse-flight-deck/releases/latest" target="_blank" rel="noopener">GitHub releases</a> or open <a href="https://phuongnguyen210295.github.io/cse-flight-deck/" target="_blank" rel="noopener">the website</a>. Below, each building opens walking directions in Google Maps.</div>
      ${dirList(true)}</section>`;
  }
  const q=ui.mapQ||'';
  return `<section class="panel">
    <div><h2>Campus map</h2><p class="muted" style="margin:2px 0 0">Live GPS guidance to the building for your class on Belknap Campus.</p></div>
    <div class="card" id="guideBox">${guideHTML()}</div>
    ${classPanel()}
    <div style="display:grid;gap:6px"><label class="label" for="bsearch">Find a building</label><input id="bsearch" value="${esc(q)}" placeholder="Duthie, Ekstrom, Natural Sciences…" autocomplete="off" style="border:1px solid var(--line);border-radius:6px;padding:8px 10px;background:var(--surface)"><div class="chips" id="bresults">${searchResults(q)}</div></div>
    <div id="mapSlot"></div>
    <p class="muted" style="margin:-12px 0 0;font-size:.8rem">Blue: classrooms · Amber: campus life · Pink: administration · Purple: housing · Green: athletics. Zoom in to see building names.</p>
    <details class="card"><summary>All buildings (${BLD.length})</summary>${dirList(false)}</details>
  </section>`;
}
function searchResults(q){
  q=compact(q||'');if(q.length<2) return '';
  const hits=BLD.filter(b=>compact(b.name).includes(q)||b.aliases.some(a=>compact(a).includes(q))).slice(0,8);
  return hits.length?hits.map(b=>`<button data-act="m-dest" data-b="${b.id}">${esc(b.name)} <span class="mono muted" style="font-size:.75rem">${esc(b.grid)}</span></button>`).join(''):'<span class="muted" style="font-size:.88rem">No building matches.</span>';
}
function dirList(external){
  return Object.keys(CAT_NAME).map(cat=>`<div style="margin-top:12px"><div class="label">${CAT_NAME[cat]}</div><ul class="dir-list">${BLD.filter(b=>b.cat===cat).sort((a,b)=>a.name.localeCompare(b.name)).map(b=>external
    ?`<li><a href="https://www.google.com/maps/dir/?api=1&destination=${b.lat},${b.lon}&travelmode=walking" target="_blank" rel="noopener">${esc(b.name)}</a><span class="mono">${esc(b.grid)}</span></li>`
    :`<li><button data-act="m-dest" data-b="${b.id}">${esc(b.name)}</button><span class="mono">${esc(b.grid)}</span></li>`).join('')}</ul></div>`).join('');
}
function mapClick(el){
  const a=el.dataset.act,id=el.dataset.b;
  switch(a){
    case 'm-dest':setDest(id);break;
    case 'm-guide':state.mapDest=id;M.arrivedFor=null;persist();setTab('map');startTracking();break;
    case 'm-track':if(M.watch!==null){stopTracking();refreshGuide()}else startTracking();break;
    case 'm-center':M.follow=false;fitBoth();updateLocBtn();break;
    case 'm-me':centerMe();if(M.watch!==null)refreshGuide();document.getElementById('mapHost').scrollIntoView({behavior:'smooth',block:'center'});break;
    case 'm-day':ui.mapDay=+el.dataset.d;M.pendingFit=true;render();break;
    case 'm-all':ui.mapAll=!ui.mapAll;M.pendingFit=true;render();break;
    case 'm-show':{const b=BLD_BY_ID[id];if(b&&M.map){M.follow=false;updateLocBtn();M.map.setView(bpos(b),18,{animate:false});const mk=M.clsMarkers&&M.clsMarkers[id];if(mk)mk.openPopup();document.getElementById('mapHost').scrollIntoView({behavior:'smooth',block:'center'})}break}
    case 'm-clear':state.mapDest=null;persist();drawDest();drawMe();refreshGuide();break;
    case 'm-pin':{const b=BLD_BY_ID[state.mapDest];if(b&&M.me){state.mapPins[b.id]=[M.me.lat,M.me.lon];persist();if(b.marker)b.marker.setLatLng(bpos(b));drawDest();drawMe();refreshGuide()}break}
    case 'm-unpin':{const b=BLD_BY_ID[state.mapDest];if(b){delete state.mapPins[b.id];persist();if(b.marker)b.marker.setLatLng(bpos(b));drawDest();drawMe();refreshGuide()}break}
  }
}
mapHost.addEventListener('click',e=>{const el=e.target.closest('[data-act^="m-"]');if(el){e.preventDefault();e.stopPropagation();mapClick(el)}});

/* ---------- render & events ---------- */
function render(){
  document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===ui.tab)));
  const sx=window.scrollX, sy=window.scrollY;
  if(mapHost.parentNode!==document.body){document.body.appendChild(mapHost);mapHost.hidden=true}
  app.innerHTML=({overview:vOverview,schedule:vSchedule,map:vMap,plan:vPlan,study:vStudy,career:vCareer,timer:vTimer}[ui.tab]||vOverview)();
  const slot=document.getElementById('mapSlot');
  if(slot){
    slot.appendChild(mapHost);mapHost.hidden=false;
    loadLeaflet().then(()=>{const fresh=!M.map;initMap();if(M.map){M.map.invalidateSize();drawDest();drawMe();drawClasses();updateLocBtn();
      if(M.pendingFit){M.pendingFit=false;fitDay()}
      else if(fresh){if(state.mapDest&&!M.me)fitBoth();else if(!state.mapDest)fitDay()}}})
      .catch(()=>{mapHost.innerHTML='<p class="muted" style="padding:16px">The map could not load. Check your internet connection and reopen this tab.</p>'});
    updateGuide();
  }
  window.scrollTo(sx,sy);
}
function setTab(t){if(t!=='map'&&ui.tab==='map')stopTracking();ui.tab=t;try{localStorage.setItem(LS+'-tab',t)}catch(e){}render();window.scrollTo(0,0)}
document.getElementById('tabs').addEventListener('click',e=>{const b=e.target.closest('button[data-tab]');if(b) setTab(b.dataset.tab)});
const byId=id=>state.plan.find(c=>c.id===id);

app.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  const a=el.dataset.act, id=el.dataset.id;
  if(el.tagName==='INPUT') return; // checkboxes handled on change
  if(a.startsWith('s-')){schedClick(el);return}
  if(a.startsWith('m-')){mapClick(el);return}
  switch(a){
    case 'cycle':{const c=byId(id);c.status=STATUS[(STATUS.indexOf(c.status)+1)%3];if(c.status!=='done')c.grade='';persist();render();break}
    case 'toggleEdit':ui.edit=!ui.edit;render();break;
    case 'toggleImport':ui.importOpen=!ui.importOpen;render();break;
    case 'add':state.plan.push({id:uid(),year:+el.dataset.y,term:el.dataset.t,code:'NEW 100',title:'New course',cr:3,status:'planned',grade:''});persist();render();break;
    case 'addYear':{const y=Math.max(4,...state.plan.map(c=>c.year))+1;state.plan.push({id:uid(),year:y,term:'Fall',code:'NEW 100',title:'New course',cr:3,status:'planned',grade:''});persist();render();break}
    case 'del':state.plan=state.plan.filter(c=>c.id!==id);persist();render();break;
    case 'parse':ui.importText=document.getElementById('importText').value;ui.importPreview=parsePlan(ui.importText);render();break;
    case 'applyImport':{const old=new Map(state.plan.map(c=>[c.code.toUpperCase(),c]));
      state.plan=ui.importPreview.map(c=>{const o=old.get(c.code.toUpperCase());return {id:uid(),...c,status:o?o.status:'planned',grade:o?o.grade:''}});
      state.starter=false;ui.importPreview=null;ui.importText='';ui.importOpen=false;persist();render();break}
    case 'askReset':ui.confirmReset=true;render();break;
    case 'cancelReset':ui.confirmReset=false;render();break;
    case 'doReset':state.plan=starterPlan();state.starter=true;ui.confirmReset=false;persist();render();break;
    case 'topic':state.topic=id;ui.reveal=false;ui.cardKey=null;persist();render();break;
    case 'goSched':setTab('schedule');break;
    case 'goTopic':state.topic=id;ui.reveal=false;ui.cardKey=null;persist();setTab('study');break;
    case 'reveal':ui.reveal=true;render();break;
    case 'skip':{const t=TOPIC_BY_ID[ui.cardKey.split(':')[0]];ui.cardKey=pickCard(t);ui.reveal=false;render();break}
    case 'hit':case 'miss':{const k=ui.cardKey;state.cards[k]=a==='hit'?Math.min(4,(state.cards[k]||0)+1):0;persist();const t=TOPIC_BY_ID[k.split(':')[0]];ui.cardKey=pickCard(t);ui.reveal=false;render();break}
    case 'track':state.career.track=id;state.career.chosen=true;ui.trackPick=false;persist();render();break;
    case 'trackChange':ui.trackPick=true;render();window.scrollTo(0,0);break;
    case 'trackCancel':ui.trackPick=false;render();break;
    case 'goCareer':setTab('career');break;
    case 'tstart':
      if(T.running){clearInterval(T.iv);T.running=false;tick();T.running=false}
      else{T.end=Date.now()+T.left*1000;T.running=true;T.iv=setInterval(tick,500);try{actx=actx||new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}
      render();break;
    case 'treset':clearInterval(T.iv);T.running=false;T.left=(T.mode==='focus'?T.len:T.brk)*60;document.title='CSE Flight Deck';render();break;
    case 'tswitch':clearInterval(T.iv);T.running=false;T.mode=T.mode==='focus'?'break':'focus';T.left=(T.mode==='focus'?T.len:T.brk)*60;render();break;
    case 'manual':{const inp=document.getElementById('manual');const v=Math.round(+inp.value);if(v>0&&v<=600){addMinutes(v,T.course);render()}break}
  }
});
app.addEventListener('change',e=>{
  const el=e.target;
  if(el.id==='schedFile'){
    const f=el.files&&el.files[0];if(!f) return;
    if(f.size>3e6){ui.sched.preview={classes:[],term:null};render();return}
    f.text().then(t=>{ui.sched.text=/BEGIN:VCALENDAR/.test(t)?'':t;ui.sched.preview=readSchedule(t);ui.sched.target=pickTarget(ui.sched.preview);render()});
    return;
  }
  if(el.dataset.sf==='term'){state.schedule.active=el.value;ui.sched.confirmDel=false;ui.sched.form=null;persist();render();return}
  if(el.dataset.sf==='target'){ui.sched.target=el.value;render();return}
  if(el.dataset.act==='check'){if(el.checked) state.career.checks[el.dataset.k]=true; else delete state.career.checks[el.dataset.k];persist();if(ui.tab!=='overview')render();else setTimeout(render,250);return}
  if(el.dataset.act==='concept'){const arr=new Set(state.concepts[el.dataset.id]||[]);const i=+el.dataset.i;el.checked?arr.add(i):arr.delete(i);state.concepts[el.dataset.id]=[...arr];persist();render();return}
  const f=el.dataset.f; if(!f) return;
  if(f==='tcourse'){T.course=el.value;return}
  if(f==='tlen'){T.len=Math.min(120,Math.max(5,+el.value||25));if(!T.running&&T.mode==='focus'){T.left=T.len*60;render()}return}
  if(f==='tbrk'){T.brk=Math.min(60,Math.max(1,+el.value||5));if(!T.running&&T.mode==='break'){T.left=T.brk*60;render()}return}
  const c=byId(el.dataset.id); if(!c) return;
  if(f==='cr') c.cr=Math.max(0,Math.min(20,+el.value||0));
  else if(f==='grade') c.grade=el.value;
  else c[f]=el.value.slice(0,120);
  persist(); if(f==='grade'||f==='cr') render();
});

app.addEventListener('input',e=>{if(e.target.id==='bsearch'){ui.mapQ=e.target.value;const r=document.getElementById('bresults');if(r)r.innerHTML=searchResults(ui.mapQ)}});
render();
initStore();
setInterval(()=>{
  const tag=(document.activeElement&&document.activeElement.tagName)||'';
  if((ui.tab==='schedule'||ui.tab==='overview'||ui.tab==='map')&&!/INPUT|TEXTAREA|SELECT/.test(tag)&&!ui.sched.form) render();
},60000);
})();
</script>

if ('serviceWorker' in navigator && !window.Capacitor && location.protocol === 'https:') {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
