name: Build Android app

on:
  push:
    branches: [main]
    paths: ['index.html', 'icons/**', 'app/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Capacitor
        run: npm install --no-audit --no-fund

      - name: Copy the web app into www
        run: npm run copy-web

      - name: Create the Android project
        run: npx cap add android

      - name: Generate app icon and splash screen
        continue-on-error: true
        run: npx capacitor-assets generate --android --iconBackgroundColor '#152030' --splashBackgroundColor '#152030'

      - name: Sync web files into Android
        run: npx cap sync android

      - name: Build APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../../CSE-Flight-Deck.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CSE-Flight-Deck-apk
          path: CSE-Flight-Deck.apk

      - name: Publish release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" CSE-Flight-Deck.apk \
            --title "CSE Flight Deck 1.0.${{ github.run_number }}" \
            --notes "Android app build from commit ${GITHUB_SHA::7}. On your phone, download CSE-Flight-Deck.apk and open it to install." \
            --latest
