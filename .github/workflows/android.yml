name: Build Android app

on:
  push:
    branches: [main]
    paths: ['index.html', 'icons/**', 'vendor/**', 'app/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Gradle downloads between builds
        uses: gradle/actions/setup-gradle@v4

      - name: Install Capacitor
        run: npm install --no-audit --no-fund

      - name: Copy the web app into www
        run: npm run copy-web

      - name: Create the Android project
        run: npx cap add android

      - name: Allow location (GPS) in the app
        run: npm run location-permission

      - name: Generate app icon and splash screen
        continue-on-error: true
        run: npx capacitor-assets generate --android --iconBackgroundColor '#152030' --splashBackgroundColor '#152030'

      - name: Sync web files into Android
        run: npx cap sync android

      - name: Set version number (each build must be higher so it installs as an update)
        run: |
          sed -i -E "s/versionCode [0-9]+/versionCode $(( ${{ github.run_number }} + 100 ))/; s/versionName \"[^\"]*\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: Build APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon || { echo "Retrying in 60 s (download server may be rate-limiting)"; sleep 60; ./gradlew assembleDebug --no-daemon; }
          cp app/build/outputs/apk/debug/app-debug.apk ../../CSE-Flight-Deck.apk

      - name: Sign APK with the permanent app key
        working-directory: .
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ]; then
            echo "::error::Signing key secrets are missing. Without them the app cannot update in place."; exit 1
          fi
          printf '%s' "$KS_B64" | tr -d '\r\n ' | base64 -d > "$RUNNER_TEMP/key.p12"
          echo "Keystore size: $(stat -c %s "$RUNNER_TEMP/key.p12") bytes"
          LIST=$(keytool -list -v -keystore "$RUNNER_TEMP/key.p12" -storetype PKCS12 -storepass "$KS_PASS" 2>&1) || { echo "keytool could not read the keystore:"; echo "$LIST" | head -5; exit 1; }
          ALIAS=$(echo "$LIST" | sed -n 's/^Alias name: //p' | head -1)
          echo "Key alias: $ALIAS"
          [ -n "$ALIAS" ] || { echo "::error::No key found in keystore"; exit 1; }
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "Using $BT"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/key.p12" --ks-type PKCS12 --ks-pass env:KS_PASS --key-pass env:KS_PASS \
            --ks-key-alias "$ALIAS" --v4-signing-enabled false --out CSE-Flight-Deck-signed.apk CSE-Flight-Deck.apk
          rm -f "$RUNNER_TEMP/key.p12"
          mv CSE-Flight-Deck-signed.apk CSE-Flight-Deck.apk
          "$BT/apksigner" verify --print-certs CSE-Flight-Deck.apk | grep -iE "certificate (DN|SHA-256)" || true

      - uses: actions/upload-artifact@v4
        with:
          name: CSE-Flight-Deck-apk
          path: CSE-Flight-Deck.apk

      - name: Publish release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" CSE-Flight-Deck.apk \
            --title "CSE Flight Deck 1.0.${{ github.run_number }}" \
            --notes "Android app build from commit ${GITHUB_SHA::7}. On your phone, download CSE-Flight-Deck.apk and open it to install." \
            --latest
